name: Release (GitHub)

# Builds the plugin and creates a GitHub release (tag v<version> pointing to a build commit which
# includes vendor/ and dist/) with the distributable zip attached.
# Does NOT touch wordpress.org - use the "Deploy to wordpress.org" workflow afterwards.
#
# In case no version is entered, the current version (plugin header) is used as long as it has not been released yet.
# The force option rebuilds an already released version: the existing release (and tag) is deleted after the build
# succeeded and a new one is created.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 4.1.8 (must match the plugin header). Falls back to the current version in case it has not been released yet (or force is set). Versions containing "-" are pre-releases.'
        required: false
        type: string
      branch:
        description: 'Branch to release from'
        required: true
        default: 'main'
        type: string
      force:
        description: 'Force: rebuild a version that has already been released (deletes the existing release and tag and creates a new one)'
        required: false
        type: boolean
        default: false

run-name: Release ${{ inputs.version || 'current version' }} from ${{ inputs.branch }}${{ inputs.force && ' (force)' || '' }}

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

env:
  PLUGIN_SLUG: trusted-shops-easy-integration-for-woocommerce
  # Never expand inputs directly within run scripts via ${{ }} - pass them as env vars instead.
  VERSION_INPUT: ${{ inputs.version }}
  BRANCH: ${{ inputs.branch }}
  FORCE: ${{ inputs.force }}
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  TERM: xterm

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Validate input
        run: |
          if [ -n "$VERSION_INPUT" ] && ! printf '%s' "$VERSION_INPUT" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error::Invalid version \"$VERSION_INPUT\"."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.branch }}

      - name: Determine version
        run: |
          is_released() {
            gh release view "v$1" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 || git ls-remote --exit-code --tags origin "refs/tags/v$1" > /dev/null 2>&1
          }

          CURRENT=$(grep -i "^ \* Version:" "${PLUGIN_SLUG}.php" | awk '{print $NF}' | tr -d '\r')
          LAST_TAG=$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=1" --jq '.[0].tag_name // ""')
          echo "Latest release -> ${LAST_TAG:-none}, current version -> ${CURRENT:-none}"

          if [ -n "$VERSION_INPUT" ]; then
            VERSION="$VERSION_INPUT"
          elif [ -n "$CURRENT" ] && { [ "$FORCE" = "true" ] || ! is_released "$CURRENT"; }; then
            # The current version has not been released yet (or is rebuilt by force).
            VERSION="$CURRENT"
          else
            echo "::error::The current version \"${CURRENT}\" has already been released. Bump the version (bin/bump-version.sh) or use the force option to rebuild it."
            exit 1
          fi

          echo "Version -> ${VERSION}"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Check versions and tag
        id: check_tag
        run: |
          PLUGIN_VERSION=$(grep -i "^ \* Version:" "${PLUGIN_SLUG}.php" | awk '{print $NF}' | tr -d '\r')
          README_STABLE=$(grep -i "^Stable tag:" readme.txt | awk '{print $NF}' | tr -d '\r')

          if [ "$PLUGIN_VERSION" != "$VERSION" ]; then
            echo "::error::Version in ${PLUGIN_SLUG}.php is \"${PLUGIN_VERSION}\" but \"${VERSION}\" was requested."
            exit 1
          fi

          if [ "$README_STABLE" != "$VERSION" ] && [ "$README_STABLE" != "trunk" ]; then
            echo "::warning::Stable tag in readme.txt is \"${README_STABLE}\", not \"${VERSION}\"."
          fi

          if gh release view "v${VERSION}" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 || git ls-remote --exit-code --tags origin "refs/tags/v${VERSION}" > /dev/null 2>&1; then
            if [ "$FORCE" = "true" ]; then
              echo "::warning::Release v${VERSION} already exists - force rebuild: the existing release and tag will be replaced."
              echo "exists=true" >> "$GITHUB_OUTPUT"
            else
              echo "::error::Release/tag v${VERSION} already exists. Use the force option to rebuild it."
              exit 1
            fi
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # Build with the lowest supported PHP version (matches config.platform.php in composer.json) so that
      # composer scripts and autoloader generation run under the same version the dependencies are resolved for.
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          tools: composer
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Bump composer.json version
        run: bash bin/bump-version.sh -s -c -v "$VERSION"

      - name: Composer install
        run: composer install --no-dev --no-interaction --prefer-dist
        env:
          COMPOSER_AUTH: '{"github-oauth": {"github.com": "${{ secrets.GITHUB_TOKEN }}"}}'

      - name: JS build
        run: |
          npm ci
          npm run build

      - name: Build distributable zip
        run: |
          # Built outside the workspace so that the build commit below does not pick it up.
          mkdir -p "${RUNNER_TEMP}/dist/${PLUGIN_SLUG}"
          rsync -r --delete --delete-excluded --exclude-from=.distignore ./ "${RUNNER_TEMP}/dist/${PLUGIN_SLUG}/"
          (cd "${RUNNER_TEMP}/dist" && zip -qr "${RUNNER_TEMP}/${PLUGIN_SLUG}.zip" "${PLUGIN_SLUG}")
          unzip -l "${RUNNER_TEMP}/${PLUGIN_SLUG}.zip" | tail -1

      # Guards backwards compatibility: fails in case any shipped file (incl. vendor/)
      # contains syntax unsupported by PHP 7.4.
      - name: Lint shipped PHP files (PHP 7.4)
        run: |
          php -v | head -1
          if find "${RUNNER_TEMP}/dist/${PLUGIN_SLUG}" -name '*.php' -print0 | xargs -0 -n 100 -P 4 php -l 2>&1 | grep -v '^No syntax errors'; then
            echo "::error::PHP 7.4 syntax errors found in shipped files."
            exit 1
          fi

      - name: Create build commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout -b "build/${VERSION}"
          git add --force vendor/. dist/.
          git add .
          git commit -m "Build ${VERSION}: add vendor/ and dist/" --no-verify

      # Deleted as late as possible (after the build succeeded) to keep the window without a release short.
      - name: Delete existing release and tag (force)
        if: steps.check_tag.outputs.exists == 'true'
        run: |
          gh release delete "v${VERSION}" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true

          # The tag may exist without a release.
          if git ls-remote --exit-code --tags origin "refs/tags/v${VERSION}" > /dev/null 2>&1; then
            git push origin --delete "refs/tags/v${VERSION}"
          fi

      - name: Create tag
        run: |
          git tag --force "v${VERSION}"
          git push origin "refs/tags/v${VERSION}"

      - name: Create GitHub release
        run: |
          PRERELEASE=""
          case "$VERSION" in
            *-*) PRERELEASE="--prerelease" ;;
          esac

          gh release create "v${VERSION}" "${RUNNER_TEMP}/${PLUGIN_SLUG}.zip" \
            --verify-tag \
            --title "${VERSION}" \
            --notes "Release of version ${VERSION}. See readme.txt for details." \
            $PRERELEASE

          {
            echo "### Released v${VERSION} on GitHub"
            echo
            echo "Push it to wordpress.org via the **Deploy to wordpress.org** workflow (tag \`v${VERSION}\`)."
          } >> "$GITHUB_STEP_SUMMARY"
